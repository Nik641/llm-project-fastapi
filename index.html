<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Помощник</title>
    <!-- ИСПРАВЛЕНО: Подключен корректный CDN для компиляции стилей Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- ЛЕВАЯ ПАНЕЛЬ: История запросов -->
        <div class="md:col-span-1 bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-col h-[600px]">
            <div class="mb-4">
                <h2 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                    📜 История запросов
                </h2>
                <p id="userIp" class="text-xs text-slate-400 mt-1">Определяем IP...</p>
            </div>
            
            <div id="historyList" class="space-y-3 overflow-y-auto flex-1 pr-1 text-sm text-slate-500">
                <div class="text-center py-8 text-slate-400">Загрузка истории...</div>
            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ: Форма отправки -->
        <div class="md:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col justify-between h-[600px]">
            
            <div class="space-y-4 overflow-y-auto flex-1 pb-4">
                <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    🤖 Запрос к GPT модели
                </h1>

                <div>
                    <label for="promptInput" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Ваш промпт</label>
                    <textarea id="promptInput" rows="4" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none transition-all text-slate-700 text-sm"
                        placeholder="Введите текст запроса для ИИ..."></textarea>
                </div>

                <div id="answerContainer" class="hidden space-y-2">
                    <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Ответ модели:</h3>
                    <div id="answerText" class="bg-slate-900 text-slate-100 p-4 rounded-xl font-mono text-sm whitespace-pre-wrap leading-relaxed shadow-inner"></div>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100">
                <button id="sendBtn" onclick="sendPrompt()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md active:scale-[0.99] flex items-center justify-center gap-2">
                    Отправить запрос
                </button>
            </div>

        </div>
    </div>

    <script>
        async function loadHistory() {
            const historyList = document.getElementById('historyList');
            const userIpText = document.getElementById('userIp');

            try {
                const response = await fetch('/requests');
                if (!response.ok) throw new Error(`Ошибка сервера: ${response.status}`);
                
                const data = await response.json();
                userIpText.innerText = `Ваш IP: ${data.ip_address}`;
                historyList.innerHTML = '';

                if (!data.from_db || data.from_db.length === 0) {
                    historyList.innerHTML = '<div class="text-center py-8 text-slate-400">История пуста</div>';
                    return;
                }

                data.from_db.slice().reverse().forEach(item => {
                    const card = document.createElement('div');
                    card.className = "p-3 bg-slate-50 rounded-xl border border-slate-100 hover:bg-slate-100/70 transition-colors cursor-pointer text-left";
                    
                    const pText = item.prompt || "Без текста промпта";
                    const rText = item.response || item.answer || "Нет ответа в БД";
                    
                    card.onclick = () => showInMainArea(pText, rText);
                    
                    card.innerHTML = `
                        <div class="font-medium text-slate-700 truncate">❓ ${pText}</div>
                        <div class="text-xs text-slate-400 truncate mt-1">🤖 ${rText}</div>
                    `;
                    historyList.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                historyList.innerHTML = `
                    <div class="text-center py-8 text-red-500 text-xs font-semibold">
                        Не удалось загрузить историю
                        <div class="text-[10px] text-slate-400 font-mono mt-2 bg-slate-50 p-2 rounded border border-red-100 text-left overflow-x-auto whitespace-pre-wrap">
                            ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        async function sendPrompt() {
            const promptInput = document.getElementById('promptInput');
            const sendBtn = document.getElementById('sendBtn');
            const answerContainer = document.getElementById('answerContainer');
            const answerText = document.getElementById('answerText');

            const prompt = promptInput.value.trim();
            if (!prompt) {
                alert('Пожалуйста, введите текст промпта');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = 'Генерация ответа... ⏳';
            sendBtn.className = "w-full bg-slate-400 text-white font-semibold py-3 px-6 rounded-xl cursor-not-allowed flex items-center justify-center gap-2";

            try {
                // ИСПРАВЛЕНО: Запрос переведён на относительный путь
                const response = await fetch('/requests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: { prompt: prompt }
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    answerText.innerText = data.answer;
                    answerText.classList.remove('text-red-400');
                    answerContainer.classList.remove('hidden');
                    promptInput.value = '';
                } else {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || `Ошибка сервера: ${response.status}`);
                }

                await loadHistory();

            } catch (error) {
                answerText.innerText = `Ошибка: ${error.message}`;
                answerText.classList.add('text-red-400');
                answerContainer.classList.remove('hidden');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'Отправить запрос';
                sendBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md active:scale-[0.99] flex items-center justify-center gap-2";
            }
        }

        function showInMainArea(prompt, answer) {
            document.getElementById('promptInput').value = prompt;
            document.getElementById('answerText').innerText = answer;
            document.getElementById('answerText').classList.remove('text-red-400');
            document.getElementById('answerContainer').classList.remove('hidden');
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
